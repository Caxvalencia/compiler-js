<svg width="760" height="260" viewBox="0 0 760 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">compiler-js logo</title>
  <desc id="desc">Minimal compiler-js project image showing source code transformed into tokens, automata, and parser output.</desc>
  <defs>
